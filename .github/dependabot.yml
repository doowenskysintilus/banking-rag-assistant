version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  # Base image bumps (nginx/python/node) are how the Trivy findings from
  # ci.yml actually get resolved over time — see that workflow's comment.
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /nginx
    schedule: { interval: weekly }
