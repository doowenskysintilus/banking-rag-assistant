# Single public entry point: serves the SPA and reverse-proxies the API on
# one origin, so the browser never needs CORS at all in this deployment
# shape (backend.core.config.Settings.cors_origins only matters for a
# cross-origin frontend — see frontend/Dockerfile's VITE_API_BASE_URL note).

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:8000;
}

# Monitoring UIs — consolidated behind this same edge origin rather than
# publishing separate host ports for them (one entry point to firewall/put
# behind SSO later, instead of three). No additional auth is layered on here
# beyond each tool's own login (Grafana) — put this whole proxy behind a VPN
# or add e.g. `auth_request`/basic auth in front of these locations before
# exposing it on the public internet.
upstream grafana_upstream {
    server grafana:3000;
}

upstream prometheus_upstream {
    server prometheus:9090;
}

upstream alertmanager_upstream {
    server alertmanager:9093;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;

    # Real client IP for backend.core.audit's ip_address field and for
    # AuthService's brute-force lockout accounting to mean anything —
    # without this the backend would only ever see this proxy's own IP.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Prometheus scrapes the backend directly on the internal compose network
    # (see monitoring/prometheus/prometheus.yml) — never expose /metrics on
    # the public edge.
    location = /metrics {
        deny all;
        return 404;
    }

    # This proxy's own liveness check (see nginx/Dockerfile's HEALTHCHECK) —
    # answered by nginx itself, so it stays accurate even if the frontend/
    # backend upstreams are briefly unavailable during a rolling restart.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SSE streaming (backend.api.v1.routers.chat's /chat/stream) needs
    # buffering fully disabled — nginx defaults to buffering upstream
    # responses, which would batch the SSE `event:`/`data:` frames instead of
    # forwarding each one as it's written, breaking the whole point of
    # streaming a token at a time.
    location = /api/v1/chat/stream {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
        proxy_set_header Connection $connection_upgrade;
    }

    # Extra rate limiting on the credential-checking endpoints specifically
    # (see nginx.conf's limit_req_zone comment).
    location ~ ^/api/v1/auth/(login|token)$ {
        limit_req zone=auth_login burst=3 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
    }

    location /api/v1/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /grafana/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
    }

    location /prometheus/ {
        proxy_pass http://prometheus_upstream;
        proxy_http_version 1.1;
    }

    location /alertmanager/ {
        proxy_pass http://alertmanager_upstream/;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
    }
}
