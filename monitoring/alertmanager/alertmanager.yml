# Started with --config.expand-env (see docker-compose.yml) so
# ${ALERTMANAGER_SLACK_WEBHOOK_URL} below is read from the environment rather
# than committed here. Leave it unset to effectively disable the Slack
# receiver (Alertmanager will still accept and group alerts — they just won't
# be delivered anywhere until a real webhook is configured).

global:
  resolve_timeout: 5m

route:
  receiver: slack-default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: slack-critical
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: slack-default
      repeat_interval: 12h

receivers:
  - name: slack-default
    slack_configs:
      - api_url: "${ALERTMANAGER_SLACK_WEBHOOK_URL}"
        channel: "#banking-rag-alerts"
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

  - name: slack-critical
    slack_configs:
      - api_url: "${ALERTMANAGER_SLACK_WEBHOOK_URL}"
        channel: "#banking-rag-alerts-critical"
        send_resolved: true
        title: '🚨 {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # A critical BackendDown firing makes latency/error-rate alerts for the same
  # target redundant noise — suppress them while the outage is the real story.
  - source_matchers:
      - alertname = "BackendDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["job"]
