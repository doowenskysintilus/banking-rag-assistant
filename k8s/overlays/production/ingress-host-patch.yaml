# Replaces the base's placeholder hostname. `rules` has no merge key in the
# Ingress schema, so a strategic-merge patch replaces the whole list — these
# blocks restate the base's paths/backends, just with the real host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-rag-main
spec:
  tls:
    - hosts: ["banking-rag.yourbank.example"]
      secretName: banking-rag-tls
  rules:
    - host: banking-rag.yourbank.example
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /metrics
            pathType: Exact
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-rag-chat-stream
spec:
  rules:
    - host: banking-rag.yourbank.example
      http:
        paths:
          - path: /api/v1/chat/stream
            pathType: Exact
            backend:
              service: { name: backend, port: { number: 8000 } }
