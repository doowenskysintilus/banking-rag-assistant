# A single-replica Postgres StatefulSet is fine for a demo/small deployment,
# but has no HA and its PVC is tied to whatever node/zone it first scheduled
# on. For real production, prefer a managed database (RDS, Cloud SQL, Azure
# Database for PostgreSQL) or a proper operator (CloudNativePG, Zalando's
# postgres-operator) and point Secret `backend-secrets`'s DATABASE_URL at
# that instead of this StatefulSet's Service.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: banking-rag
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: backend-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: backend-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: backend-secrets, key: POSTGRES_DB }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: banking-rag
spec:
  clusterIP: None # headless — StatefulSet gets a stable DNS name, not load-balanced
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
