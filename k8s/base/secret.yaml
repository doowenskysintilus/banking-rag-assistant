# ⚠️ TEMPLATE ONLY — every value below is a placeholder. Do not `kubectl
# apply -f` this file as-is, and never commit real secret values to git.
#
# For a real deployment, generate this instead of editing placeholders in
# place, e.g.:
#
#   kubectl create secret generic backend-secrets -n banking-rag \
#     --from-literal=SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=ENCRYPTION_KEY="$(python -c 'from backend.security.encryption import generate_key; print(generate_key())')" \
#     --from-literal=OPENAI_API_KEY="sk-..." \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://banking_rag:...@postgres:5432/banking_rag" \
#     --from-literal=REDIS_URL="redis://redis:6379/0"
#
# In a real GitOps setup, replace this manifest entirely with a
# SealedSecret (bitnami-labs/sealed-secrets) or an ExternalSecret
# (external-secrets.io, pulling from Vault/AWS Secrets Manager/etc.) — either
# lets the *encrypted* or *reference* form live in git safely, unlike this.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: banking-rag
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME_openssl_rand_base64_48"
  ENCRYPTION_KEY: "REPLACE_ME_see_backend.security.encryption.generate_key"
  OPENAI_API_KEY: "REPLACE_ME_sk-..."
  DATABASE_URL: "postgresql+asyncpg://banking_rag:REPLACE_ME@postgres:5432/banking_rag"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_USER: "banking_rag"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "banking_rag"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: banking-rag
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "REPLACE_ME"
