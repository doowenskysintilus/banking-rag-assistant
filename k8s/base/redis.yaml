# Single-instance Redis — only used as a cache (backend.retrieval.embeddings
# and the BM25-corpus TTL cache in backend.retrieval.enterprise), so losing it
# degrades performance rather than correctness. That makes a single replica
# with a PVC an acceptable trade-off here in a way it wouldn't be for
# Postgres; a managed Redis (ElastiCache/Memorystore) is still preferable at
# real scale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: banking-rag
spec:
  replicas: 1
  strategy:
    type: Recreate # a rolling update would briefly run two Redis pods fighting over the same PVC
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: banking-rag
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: banking-rag
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
