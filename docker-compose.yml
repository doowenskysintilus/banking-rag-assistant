name: banking-rag-assistant

# Full production-shaped stack: edge proxy, frontend, backend, Postgres,
# Redis, and the monitoring stack. Copy .env.example to .env first — this
# file is read automatically by `docker compose` for ${VAR} interpolation
# below, and is also mounted into the backend/migrate containers as env_file.
#
#   cp .env.example .env   # then fill in SECRET_KEY, OPENAI_API_KEY, etc.
#   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-banking_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_rag} -d ${POSTGRES_DB:-banking_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  # One-shot: applies Alembic migrations before `backend` starts, and only
  # once — not per-replica (see backend/docker-entrypoint.sh's comment on why
  # RUN_MIGRATIONS_ON_STARTUP defaults to false).
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: banking-rag-backend:${IMAGE_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-banking_rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banking_rag}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend_net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: banking-rag-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_JSON: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-banking_rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banking_rag}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - document_storage:/app/storage/documents
      - faiss_indices:/app/vector_db/faiss_indices
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [backend_net, edge_net, monitoring_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: banking-rag-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge_net]

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: banking-rag-nginx:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [edge_net, monitoring_net]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.external-url=/prometheus/"
    depends_on:
      backend:
        condition: service_healthy
    networks: [monitoring_net]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      ALERTMANAGER_SLACK_WEBHOOK_URL: ${ALERTMANAGER_SLACK_WEBHOOK_URL:-}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.external-url=/alertmanager/"
      - "--config.expand-env"
    networks: [monitoring_net]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [monitoring_net]

networks:
  # Postgres/Redis are reachable only from backend+migrate — never exposed to
  # the edge network the reverse proxy and frontend sit on.
  backend_net:
  edge_net:
  monitoring_net:

volumes:
  postgres_data:
  redis_data:
  document_storage:
  faiss_indices:
  prometheus_data:
  grafana_data:
