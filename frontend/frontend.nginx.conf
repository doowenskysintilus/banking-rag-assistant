# Serves the built SPA. This container is never hit directly by users in the
# full stack (see docker-compose.yml / k8s Ingress) — the edge reverse proxy
# (nginx/ or the cluster Ingress) is the actual entry point and forwards `/`
# here, `/api/v1` to the backend. Kept intentionally simple: this nginx's only
# job is "serve static files with SPA fallback", not TLS/rate-limiting/auth.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames (Vite's default `index-<hash>.js`) are safe to cache
    # forever — a new build always produces a new filename.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached — it's what references the
    # current hashed asset filenames, so a stale copy would keep pointing at
    # assets from a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router (client-side routing): any path that isn't a real static
    # file falls back to index.html so deep links (e.g. /conversations/abc)
    # work on a hard refresh instead of 404ing at the file-serving layer.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
